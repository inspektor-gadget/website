<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Investigate a Kubernetes network timeout with targeted packet capture</title>
  <desc id="desc">A backend pod connects to a database while Inspektor Gadget captures only the relevant packets. The resulting packet sequence distinguishes no response, an immediate reset, and a completed handshake that later stalls. Kubernetes metadata then helps determine whether the failure follows a pod, node, or database endpoint.</desc>
  <defs>
    <linearGradient id="clusterBackground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#faf5f9"/>
      <stop offset="1" stop-color="#eef4ff"/>
    </linearGradient>
    <linearGradient id="igBackground" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f052a"/>
      <stop offset="1" stop-color="#58204f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#2f052a" flood-opacity=".12"/>
    </filter>
    <marker id="requestArrow" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto">
      <path d="M0 1 16 9 0 17Z" fill="#e61d4b"/>
    </marker>
    <marker id="evidenceArrow" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto">
      <path d="M0 1 16 9 0 17Z" fill="#76536f"/>
    </marker>
  </defs>

  <rect width="1600" height="900" rx="32" fill="#fff"/>

  <g font-family="system-ui, sans-serif">
    <text x="60" y="62" fill="#2f052a" font-size="36" font-weight="750">
      Turn one network timeout into a testable next step
    </text>
    <text x="60" y="101" fill="#6f6070" font-size="21">
      Capture one connection, classify the packet sequence, then compare Kubernetes context
    </text>

    <rect x="45" y="145" width="1510" height="320" rx="30" fill="url(#clusterBackground)" stroke="#8aa9dc" stroke-width="3" stroke-dasharray="10 8"/>
    <rect x="78" y="124" width="250" height="44" rx="22" fill="#326ce5"/>
    <text x="203" y="153" fill="#fff" font-size="20" font-weight="700" text-anchor="middle">Kubernetes cluster</text>

    <g transform="translate(105 220)" filter="url(#shadow)">
      <rect width="350" height="150" rx="24" fill="#fff" stroke="#4385f5" stroke-width="3"/>
      <rect x="28" y="43" width="92" height="58" rx="10" fill="#eef4ff" stroke="#4385f5" stroke-width="3"/>
      <path d="M47 78h54M57 61h34" stroke="#4385f5" stroke-width="6" stroke-linecap="round"/>
      <text x="235" y="53" fill="#243b63" font-size="25" font-weight="700" text-anchor="middle">backend pod</text>
      <text x="235" y="88" fill="#607394" font-size="19" text-anchor="middle">production namespace</text>
      <text x="235" y="119" fill="#607394" font-size="19" text-anchor="middle">connection times out</text>
    </g>

    <g transform="translate(650 220)" filter="url(#shadow)">
      <rect width="360" height="150" rx="24" fill="url(#igBackground)"/>
      <circle cx="62" cy="75" r="31" fill="#e61d4b"/>
      <path d="M48 75h28M62 61v28" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
      <text x="230" y="51" fill="#fff" font-size="24" font-weight="700" text-anchor="middle">Targeted capture</text>
      <text x="230" y="87" fill="#dfcfde" font-size="18" text-anchor="middle">one pod + TCP/5432</text>
      <text x="230" y="118" fill="#dfcfde" font-size="18" text-anchor="middle">enriched pcap-ng</text>
    </g>

    <g transform="translate(1200 220)" filter="url(#shadow)">
      <rect width="285" height="150" rx="24" fill="#fff8e9" stroke="#f19b24" stroke-width="3"/>
      <ellipse cx="67" cy="53" rx="34" ry="15" fill="#fff" stroke="#f19b24" stroke-width="4"/>
      <path d="M33 53v45c0 8 15 15 34 15s34-7 34-15V53M33 76c0 8 15 15 34 15s34-7 34-15" fill="#fff" stroke="#f19b24" stroke-width="4"/>
      <text x="195" y="54" fill="#7a4d0f" font-size="24" font-weight="700" text-anchor="middle">database</text>
      <text x="195" y="89" fill="#8f6e42" font-size="19" text-anchor="middle">endpoint</text>
      <text x="195" y="119" fill="#8f6e42" font-size="19" text-anchor="middle">TCP/5432</text>
    </g>

    <path d="M455 295H650" fill="none" stroke="#e61d4b" stroke-width="5" marker-end="url(#requestArrow)"/>
    <path d="M1010 295H1200" fill="none" stroke="#e61d4b" stroke-width="5" marker-end="url(#requestArrow)"/>
    <text x="552" y="277" fill="#b3163c" font-size="18" font-weight="700" text-anchor="middle">SYN and data</text>
    <text x="1105" y="277" fill="#b3163c" font-size="18" font-weight="700" text-anchor="middle">filtered traffic</text>

    <path d="M830 370V505" fill="none" stroke="#76536f" stroke-width="4" stroke-dasharray="8 7" marker-end="url(#evidenceArrow)"/>
    <text x="850" y="438" fill="#76536f" font-size="18" font-weight="700">inspect packet sequence</text>

    <g transform="translate(55 535)" filter="url(#shadow)">
      <rect width="440" height="185" rx="24" fill="#fce8ee" stroke="#e61d4b" stroke-width="3"/>
      <text x="220" y="45" fill="#7f1832" font-size="24" font-weight="700" text-anchor="middle">SYN, then no response</text>
      <path d="M60 85H185" stroke="#e61d4b" stroke-width="5" marker-end="url(#requestArrow)"/>
      <path d="M255 85H380" stroke="#e61d4b" stroke-width="5" marker-end="url(#requestArrow)"/>
      <text x="220" y="124" fill="#9a4259" font-size="18" text-anchor="middle">repeated SYNs</text>
      <text x="220" y="155" fill="#7f1832" font-size="18" font-weight="700" text-anchor="middle">check policy, route, loss, endpoint</text>
    </g>

    <g transform="translate(580 535)" filter="url(#shadow)">
      <rect width="440" height="185" rx="24" fill="#fff8e9" stroke="#f19b24" stroke-width="3"/>
      <text x="220" y="45" fill="#7a4d0f" font-size="24" font-weight="700" text-anchor="middle">Immediate TCP reset</text>
      <path d="M65 85H185" stroke="#e61d4b" stroke-width="5" marker-end="url(#requestArrow)"/>
      <path d="M375 85H255" stroke="#f19b24" stroke-width="5" marker-end="url(#evidenceArrow)"/>
      <text x="220" y="124" fill="#8f6e42" font-size="18" text-anchor="middle">destination returns RST</text>
      <text x="220" y="155" fill="#7a4d0f" font-size="18" font-weight="700" text-anchor="middle">check listener, port, intermediary</text>
    </g>

    <g transform="translate(1105 535)" filter="url(#shadow)">
      <rect width="440" height="185" rx="24" fill="#eef4ff" stroke="#4385f5" stroke-width="3"/>
      <text x="220" y="45" fill="#243b63" font-size="24" font-weight="700" text-anchor="middle">Handshake succeeds</text>
      <path d="M55 85H160" stroke="#e61d4b" stroke-width="5" marker-end="url(#requestArrow)"/>
      <path d="M385 85H280" stroke="#4385f5" stroke-width="5" marker-end="url(#evidenceArrow)"/>
      <path d="M170 85H270" stroke="#e61d4b" stroke-width="5" marker-end="url(#requestArrow)"/>
      <text x="220" y="124" fill="#607394" font-size="18" text-anchor="middle">SYN, SYN-ACK, ACK, then delay</text>
      <text x="220" y="155" fill="#243b63" font-size="18" font-weight="700" text-anchor="middle">check server or application protocol</text>
    </g>

    <g transform="translate(190 785)">
      <rect width="1220" height="72" rx="22" fill="#fff" stroke="#76536f" stroke-width="3"/>
      <text x="610" y="30" fill="#4f344a" font-size="22" font-weight="700" text-anchor="middle">
        Compare pod, node, and destination metadata with a healthy request
      </text>
      <text x="610" y="56" fill="#76536f" font-size="18" text-anchor="middle">
        Does the failure follow one replica, one worker node, one network path, or one database endpoint?
      </text>
    </g>
  </g>
</svg>
