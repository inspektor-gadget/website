<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1000" role="img" aria-labelledby="title desc">
  <title id="title">Diagnose and update a Kubernetes NetworkPolicy with Inspektor Gadget</title>
  <desc id="desc">A frontend pod attempts a TCP connection to an API pod, but the current NetworkPolicy blocks it. Trace TCP shows a client connect without a server accept. The NetworkPolicy advisor separately observes a controlled successful request and generates a policy suggestion, which is reviewed and applied to allow the connection.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#faf5f9"/>
      <stop offset="1" stop-color="#eef4ff"/>
    </linearGradient>
    <linearGradient id="igBackground" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f052a"/>
      <stop offset="1" stop-color="#58204f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#2f052a" flood-opacity=".12"/>
    </filter>
    <marker id="blockedArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 8 4 0 8Z" fill="#e61d4b"/>
    </marker>
    <marker id="successArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 8 4 0 8Z" fill="#4385f5"/>
    </marker>
    <marker id="eventArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 8 4 0 8Z" fill="#76536f"/>
    </marker>
  </defs>

  <rect width="1800" height="1000" rx="32" fill="#fff"/>

  <g font-family="system-ui, sans-serif">
    <text x="60" y="62" fill="#2f052a" font-size="36" font-weight="750">
      Turn a blocked connection into a reviewed NetworkPolicy
    </text>
    <text x="60" y="101" fill="#6f6070" font-size="23">
      Diagnose the lifecycle, observe intended traffic, review the suggestion, and apply the minimum policy
    </text>

    <rect x="45" y="145" width="1710" height="720" rx="30" fill="url(#background)" stroke="#8aa9dc" stroke-width="3" stroke-dasharray="10 8"/>
    <rect x="78" y="124" width="250" height="44" rx="22" fill="#326ce5"/>
    <text x="203" y="153" fill="#fff" font-size="20" font-weight="700" text-anchor="middle">Kubernetes cluster</text>

    <g transform="translate(100 225)" filter="url(#shadow)">
      <rect width="340" height="155" rx="24" fill="#fff" stroke="#4385f5" stroke-width="3"/>
      <rect x="30" y="40" width="92" height="60" rx="10" fill="#eef4ff" stroke="#4385f5" stroke-width="3"/>
      <path d="M49 77h54M59 59h34" stroke="#4385f5" stroke-width="6" stroke-linecap="round"/>
      <text x="225" y="54" fill="#243b63" font-size="26" font-weight="700" text-anchor="middle">frontend pod</text>
      <text x="225" y="88" fill="#607394" font-size="20" text-anchor="middle">app=frontend</text>
      <text x="225" y="120" fill="#607394" font-size="20" text-anchor="middle">starts TCP connect</text>
    </g>

    <g transform="translate(620 225)" filter="url(#shadow)">
      <rect width="300" height="155" rx="24" fill="#fff8e9" stroke="#f19b24" stroke-width="3"/>
      <path d="M32 47h72v58H32zM47 34h42M47 118h42" fill="#fff" stroke="#f19b24" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="202" y="54" fill="#7a4d0f" font-size="26" font-weight="700" text-anchor="middle">api Service</text>
      <text x="202" y="88" fill="#8f6e42" font-size="20" text-anchor="middle">selects app=api</text>
      <text x="202" y="120" fill="#8f6e42" font-size="20" text-anchor="middle">TCP port 80</text>
    </g>

    <g transform="translate(1360 225)" filter="url(#shadow)">
      <rect width="340" height="155" rx="24" fill="#fff" stroke="#76536f" stroke-width="3"/>
      <circle cx="79" cy="73" r="38" fill="#f4eef5" stroke="#76536f" stroke-width="5"/>
      <path d="M60 73h38M79 54v38" stroke="#76536f" stroke-width="7" stroke-linecap="round"/>
      <text x="232" y="54" fill="#4f344a" font-size="26" font-weight="700" text-anchor="middle">api pod</text>
      <text x="232" y="88" fill="#76536f" font-size="20" text-anchor="middle">app=api</text>
      <text x="232" y="120" fill="#76536f" font-size="20" text-anchor="middle">nginx listens on 80</text>
    </g>

    <path d="M440 302H620" fill="none" stroke="#e61d4b" stroke-width="5" marker-end="url(#blockedArrow)"/>
    <text x="530" y="283" fill="#b3163c" font-size="20" font-weight="700" text-anchor="middle">connect</text>
    <path d="M920 302H1160" fill="none" stroke="#e61d4b" stroke-width="5"/>
    <path d="M1180 287v30M1166 291l28 22M1194 291l-28 22" fill="none" stroke="#e61d4b" stroke-width="6" stroke-linecap="round"/>
    <text x="1180" y="347" fill="#b3163c" font-size="19" font-weight="700" text-anchor="middle">blocked</text>
    <path d="M1205 302H1360" fill="none" stroke="#4385f5" stroke-width="4" stroke-dasharray="9 7" marker-end="url(#successArrow)"/>

    <g transform="translate(950 415)" filter="url(#shadow)">
      <rect width="380" height="110" rx="20" fill="#fce8ee" stroke="#e61d4b" stroke-width="3"/>
      <path d="M28 31h58v50H28z" fill="#fff" stroke="#e61d4b" stroke-width="4"/>
      <path d="m41 56 11 9 20-25" fill="none" stroke="#e61d4b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="238" y="40" fill="#7f1832" font-size="22" font-weight="700" text-anchor="middle">Current api-ingress</text>
      <text x="238" y="71" fill="#9a4259" font-size="19" text-anchor="middle">ingress: []</text>
      <text x="238" y="98" fill="#9a4259" font-size="19" text-anchor="middle">drops the connection</text>
    </g>
    <path d="M1180 317V415" fill="none" stroke="#e61d4b" stroke-width="3" stroke-dasharray="7 6"/>

    <g transform="translate(65 610)" filter="url(#shadow)">
      <rect width="350" height="145" rx="22" fill="url(#igBackground)"/>
      <circle cx="52" cy="72" r="28" fill="#e61d4b"/>
      <path d="M40 72h24M52 60v24" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
      <text x="220" y="45" fill="#fff" font-size="24" font-weight="700" text-anchor="middle">1. Trace lifecycle</text>
      <text x="220" y="82" fill="#dfcfde" font-size="19" text-anchor="middle">frontend: connect api:80</text>
      <text x="220" y="116" fill="#dfcfde" font-size="19" text-anchor="middle">api: no accept event</text>
    </g>
    <path d="M270 380V610" fill="none" stroke="#76536f" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#eventArrow)"/>

    <g transform="translate(495 610)" filter="url(#shadow)">
      <rect width="350" height="145" rx="22" fill="url(#igBackground)"/>
      <circle cx="52" cy="72" r="28" fill="#e61d4b"/>
      <path d="M40 72h24M52 60v24" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
      <text x="220" y="34" fill="#fff" font-size="22" font-weight="700" text-anchor="middle">2. Generate</text>
      <text x="220" y="59" fill="#fff" font-size="22" font-weight="700" text-anchor="middle">NetworkPolicy</text>
      <text x="220" y="92" fill="#dfcfde" font-size="18" text-anchor="middle">observe successful traffic</text>
      <text x="220" y="121" fill="#dfcfde" font-size="18" text-anchor="middle">with advise_networkpolicy</text>
    </g>

    <g transform="translate(925 610)" filter="url(#shadow)">
      <rect width="350" height="145" rx="22" fill="#fff" stroke="#76536f" stroke-width="3"/>
      <rect x="24" y="44" width="56" height="56" rx="10" fill="#f4eef5" stroke="#76536f" stroke-width="3"/>
      <path d="M36 59h32M36 72h25M36 85h29" stroke="#76536f" stroke-width="5" stroke-linecap="round"/>
      <text x="220" y="45" fill="#4f344a" font-size="24" font-weight="700" text-anchor="middle">3. Review suggestion</text>
      <text x="220" y="82" fill="#76536f" font-size="19" text-anchor="middle">from app=frontend</text>
      <text x="220" y="116" fill="#76536f" font-size="19" text-anchor="middle">to app=api on TCP/80</text>
    </g>
    <path d="M845 682H925" fill="none" stroke="#76536f" stroke-width="4" stroke-dasharray="8 7" marker-end="url(#eventArrow)"/>
    <text x="885" y="662" fill="#76536f" font-size="18" font-weight="700" text-anchor="middle">YAML</text>

    <g transform="translate(1355 610)" filter="url(#shadow)">
      <rect width="350" height="145" rx="22" fill="#eef4ff" stroke="#4385f5" stroke-width="3"/>
      <rect x="24" y="44" width="56" height="56" rx="10" fill="#fff" stroke="#4385f5" stroke-width="3"/>
      <path d="m36 72 10 8 21-27" fill="none" stroke="#4385f5" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="220" y="45" fill="#243b63" font-size="24" font-weight="700" text-anchor="middle">4. Apply policy</text>
      <text x="220" y="82" fill="#607394" font-size="19" text-anchor="middle">update api-ingress</text>
      <text x="220" y="116" fill="#607394" font-size="19" text-anchor="middle">allow TCP/80</text>
    </g>
    <path d="M1275 682H1355" fill="none" stroke="#4385f5" stroke-width="4" marker-end="url(#successArrow)"/>

    <g transform="translate(85 930)">
      <path d="M0 0h65" stroke="#e61d4b" stroke-width="5" marker-end="url(#blockedArrow)"/>
      <text x="83" y="7" fill="#6f6070" font-size="20">Blocked connection</text>
      <path d="M330 0h65" stroke="#76536f" stroke-width="4" stroke-dasharray="8 7" marker-end="url(#eventArrow)"/>
      <text x="413" y="7" fill="#6f6070" font-size="20">Observed or generated evidence</text>
      <path d="M775 0h65" stroke="#4385f5" stroke-width="4" stroke-dasharray="9 7" marker-end="url(#successArrow)"/>
      <text x="858" y="7" fill="#6f6070" font-size="20">Allowed after policy update</text>
    </g>
  </g>
</svg>
