<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 880" role="img" aria-labelledby="title desc">
  <title id="title">DNS observability across a Kubernetes cluster</title>
  <desc id="desc">A DNS request flows from an application pod through NodeLocal DNS, the kube-dns service, and CoreDNS to an upstream resolver. Inspektor Gadget observes traffic on both worker nodes and provides enriched events to kubectl gadget.</desc>
  <defs>
    <linearGradient id="clusterBackground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#faf5f9"/>
      <stop offset="1" stop-color="#eef4ff"/>
    </linearGradient>
    <linearGradient id="igBackground" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f052a"/>
      <stop offset="1" stop-color="#58204f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#2f052a" flood-opacity=".12"/>
    </filter>
    <marker id="requestArrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0 0 7 3.5 0 7Z" fill="#e61d4b"/>
    </marker>
    <marker id="responseArrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0 0 7 3.5 0 7Z" fill="#4385f5"/>
    </marker>
    <marker id="eventArrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0 0 7 3.5 0 7Z" fill="#76536f"/>
    </marker>
  </defs>

  <rect width="1600" height="880" rx="32" fill="#fff"/>

  <g font-family="system-ui, sans-serif">
    <text x="60" y="62" fill="#2f052a" font-size="36" font-weight="750">
      Observe a DNS request across the cluster
    </text>
    <text x="60" y="101" fill="#6f6070" font-size="21">
      Inspektor Gadget traces kernel traffic on each node and adds Kubernetes context
    </text>

    <rect x="45" y="145" width="1235" height="625" rx="30" fill="url(#clusterBackground)" stroke="#8aa9dc" stroke-width="3" stroke-dasharray="10 8"/>
    <rect x="78" y="124" width="250" height="44" rx="22" fill="#326ce5"/>
    <text x="203" y="153" fill="#fff" font-size="20" font-weight="700" text-anchor="middle">Kubernetes cluster</text>

    <g filter="url(#shadow)">
      <rect x="90" y="205" width="425" height="485" rx="25" fill="#fff" stroke="#d8cbd6" stroke-width="2"/>
      <rect x="755" y="205" width="425" height="485" rx="25" fill="#fff" stroke="#d8cbd6" stroke-width="2"/>
    </g>

    <text x="302" y="248" fill="#2f052a" font-size="24" font-weight="700" text-anchor="middle">Worker node A</text>
    <text x="967" y="248" fill="#2f052a" font-size="24" font-weight="700" text-anchor="middle">Worker node B</text>

    <g transform="translate(165 290)">
      <rect width="275" height="115" rx="20" fill="#eef4ff" stroke="#4385f5" stroke-width="3"/>
      <rect x="27" y="27" width="82" height="51" rx="9" fill="#fff" stroke="#4385f5" stroke-width="3"/>
      <path d="M44 62h48M53 46h30" stroke="#4385f5" stroke-width="6" stroke-linecap="round"/>
      <text x="190" y="46" fill="#243b63" font-size="19" font-weight="700" text-anchor="middle">Application</text>
      <text x="190" y="70" fill="#243b63" font-size="19" font-weight="700" text-anchor="middle">pod</text>
      <text x="190" y="94" fill="#607394" font-size="15" text-anchor="middle">starts the lookup</text>
    </g>

    <g transform="translate(165 460)">
      <rect width="275" height="90" rx="18" fill="#fff8e9" stroke="#f19b24" stroke-width="3" stroke-dasharray="7 6"/>
      <circle cx="48" cy="45" r="22" fill="none" stroke="#f19b24" stroke-width="7"/>
      <path d="M48 28v34M31 45h34" stroke="#f19b24" stroke-width="5" stroke-linecap="round"/>
      <text x="178" y="41" fill="#7a4d0f" font-size="20" font-weight="700" text-anchor="middle">NodeLocal DNS</text>
      <text x="178" y="66" fill="#8f6e42" font-size="16" text-anchor="middle">optional cache</text>
    </g>

    <g transform="translate(565 360)">
      <rect width="140" height="140" rx="22" fill="#fce8ee" stroke="#e61d4b" stroke-width="3"/>
      <circle cx="70" cy="47" r="27" fill="#fff"/>
      <path d="M70 30v34M53 47h34" stroke="#e61d4b" stroke-width="8" stroke-linecap="round"/>
      <text x="70" y="101" fill="#7f1832" font-size="18" font-weight="700" text-anchor="middle">kube-dns</text>
      <text x="70" y="124" fill="#7f1832" font-size="18" font-weight="700" text-anchor="middle">Service</text>
    </g>

    <g transform="translate(830 325)">
      <rect width="275" height="115" rx="20" fill="#fff8e9" stroke="#f19b24" stroke-width="3"/>
      <circle cx="64" cy="48" r="27" fill="none" stroke="#f19b24" stroke-width="8"/>
      <path d="M43 66 63 62 59 43" fill="none" stroke="#f19b24" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="186" y="53" fill="#7a4d0f" font-size="21" font-weight="700" text-anchor="middle">CoreDNS pod</text>
      <text x="186" y="80" fill="#8f6e42" font-size="17" text-anchor="middle">resolves or forwards</text>
    </g>

    <g transform="translate(150 595)">
      <rect width="305" height="66" rx="18" fill="url(#igBackground)"/>
      <circle cx="37" cy="33" r="17" fill="#e61d4b"/>
      <path d="M29 33h16M37 25v16" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
      <text x="180" y="29" fill="#fff" font-size="19" font-weight="700" text-anchor="middle">Inspektor Gadget</text>
      <text x="180" y="50" fill="#dfcfde" font-size="14" text-anchor="middle">observes node A</text>
    </g>

    <g transform="translate(815 595)">
      <rect width="305" height="66" rx="18" fill="url(#igBackground)"/>
      <circle cx="37" cy="33" r="17" fill="#e61d4b"/>
      <path d="M29 33h16M37 25v16" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
      <text x="180" y="29" fill="#fff" font-size="19" font-weight="700" text-anchor="middle">Inspektor Gadget</text>
      <text x="180" y="50" fill="#dfcfde" font-size="14" text-anchor="middle">observes node B</text>
    </g>

    <g transform="translate(1325 260)" filter="url(#shadow)">
      <rect width="225" height="155" rx="22" fill="#eef4ff" stroke="#4385f5" stroke-width="3"/>
      <circle cx="112" cy="55" r="33" fill="none" stroke="#4385f5" stroke-width="7"/>
      <path d="M79 55h66M112 22c14 12 21 23 21 33s-7 21-21 33M112 22c-14 12-21 23-21 33s7 21 21 33" fill="none" stroke="#4385f5" stroke-width="5"/>
      <text x="112" y="120" fill="#243b63" font-size="20" font-weight="700" text-anchor="middle">Upstream DNS</text>
    </g>

    <g transform="translate(1325 545)" filter="url(#shadow)">
      <rect width="225" height="155" rx="22" fill="#fff" stroke="#76536f" stroke-width="3"/>
      <rect x="37" y="25" width="151" height="61" rx="10" fill="#241220"/>
      <path d="m57 45 16 11-16 11M83 69h40" fill="none" stroke="#f7d9ef" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="112" y="116" fill="#2f052a" font-size="19" font-weight="700" text-anchor="middle">kubectl gadget</text>
      <text x="112" y="139" fill="#6f6070" font-size="15" text-anchor="middle">enriched events</text>
    </g>

    <path d="M302 405V460" fill="none" stroke="#e61d4b" stroke-width="4" marker-end="url(#requestArrow)"/>
    <path d="M440 505C500 505 515 430 565 430" fill="none" stroke="#e61d4b" stroke-width="4" marker-end="url(#requestArrow)"/>
    <path d="M705 430C760 430 780 383 830 383" fill="none" stroke="#e61d4b" stroke-width="4" marker-end="url(#requestArrow)"/>
    <path d="M1105 383H1325" fill="none" stroke="#e61d4b" stroke-width="4" marker-end="url(#requestArrow)"/>
    <text x="1215" y="367" fill="#b3163c" font-size="16" font-weight="700" text-anchor="middle">external name</text>

    <path d="M1325 415H1105" fill="none" stroke="#4385f5" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#responseArrow)"/>
    <path d="M830 415C780 415 760 465 705 465" fill="none" stroke="#4385f5" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#responseArrow)"/>
    <path d="M565 465C510 465 500 535 440 535" fill="none" stroke="#4385f5" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#responseArrow)"/>
    <path d="M360 460V405" fill="none" stroke="#4385f5" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#responseArrow)"/>
    <text x="1215" y="446" fill="#346dbd" font-size="16" font-weight="700" text-anchor="middle">response returns to the pod</text>

    <path d="M302 550V595" fill="none" stroke="#76536f" stroke-width="3" stroke-dasharray="6 6"/>
    <path d="M967 440V595" fill="none" stroke="#76536f" stroke-width="3" stroke-dasharray="6 6"/>

    <path d="M302 661V730H1260V625H1325" fill="none" stroke="#76536f" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#eventArrow)"/>
    <path d="M967 661V700H1260" fill="none" stroke="#76536f" stroke-width="3" stroke-dasharray="8 7"/>
    <text x="790" y="753" fill="#76536f" font-size="16" font-weight="700" text-anchor="middle">
      DNS packets enriched with pod, namespace, node, Service, response code, and latency
    </text>

    <g transform="translate(85 825)">
      <path d="M0 0h65" stroke="#e61d4b" stroke-width="4" marker-end="url(#requestArrow)"/>
      <text x="83" y="7" fill="#6f6070" font-size="20">DNS request</text>
      <path d="M250 0h65" stroke="#4385f5" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#responseArrow)"/>
      <text x="333" y="7" fill="#6f6070" font-size="20">DNS response</text>
      <path d="M530 0h65" stroke="#76536f" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#eventArrow)"/>
      <text x="613" y="7" fill="#6f6070" font-size="20">Observed event</text>
    </g>
  </g>
</svg>
