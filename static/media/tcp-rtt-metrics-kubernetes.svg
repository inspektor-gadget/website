<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Continuously monitor TCP round-trip time from every Kubernetes node</title>
  <desc id="desc">Application TCP traffic crosses two Kubernetes worker nodes. A profile tcprtt gadget instance runs through each Inspektor Gadget daemon, turns kernel TCP RTT measurements into Prometheus histograms, and exposes them on port 2224. Prometheus scrapes every node and queries p95 latency by node for dashboards and alerts.</desc>
  <defs>
    <linearGradient id="clusterBackground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#faf5f9"/>
      <stop offset="1" stop-color="#eef4ff"/>
    </linearGradient>
    <linearGradient id="igBackground" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f052a"/>
      <stop offset="1" stop-color="#58204f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#2f052a" flood-opacity=".12"/>
    </filter>
    <marker id="trafficArrow" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto">
      <path d="M0 1 16 9 0 17Z" fill="#e61d4b"/>
    </marker>
    <marker id="metricsArrow" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto">
      <path d="M0 1 16 9 0 17Z" fill="#76536f"/>
    </marker>
  </defs>

  <rect width="1600" height="900" rx="32" fill="#fff"/>

  <g font-family="system-ui, sans-serif">
    <text x="60" y="62" fill="#2f052a" font-size="36" font-weight="750">
      Measure TCP latency continuously, node by node
    </text>
    <text x="60" y="101" fill="#6f6070" font-size="21">
      Kernel RTT histograms become Prometheus metrics for dashboards, comparisons, and alerts
    </text>

    <rect x="45" y="145" width="1030" height="650" rx="30" fill="url(#clusterBackground)" stroke="#8aa9dc" stroke-width="3" stroke-dasharray="10 8"/>
    <rect x="78" y="124" width="250" height="44" rx="22" fill="#326ce5"/>
    <text x="203" y="153" fill="#fff" font-size="20" font-weight="700" text-anchor="middle">Kubernetes cluster</text>

    <g transform="translate(95 215)" filter="url(#shadow)">
      <rect width="430" height="500" rx="26" fill="#fff" stroke="#d8cbd6" stroke-width="3"/>
      <text x="215" y="45" fill="#2f052a" font-size="25" font-weight="700" text-anchor="middle">Worker node A</text>

      <g transform="translate(65 85)">
        <rect width="300" height="115" rx="20" fill="#eef4ff" stroke="#4385f5" stroke-width="3"/>
        <rect x="25" y="30" width="78" height="50" rx="8" fill="#fff" stroke="#4385f5" stroke-width="3"/>
        <path d="M42 63h44M50 48h28" stroke="#4385f5" stroke-width="5" stroke-linecap="round"/>
        <text x="205" y="48" fill="#243b63" font-size="21" font-weight="700" text-anchor="middle">client pod</text>
        <text x="205" y="78" fill="#607394" font-size="17" text-anchor="middle">established TCP</text>
      </g>

      <g transform="translate(65 265)">
        <rect width="300" height="150" rx="22" fill="url(#igBackground)"/>
        <circle cx="50" cy="60" r="25" fill="#e61d4b"/>
        <path d="M39 60h22M50 49v22" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
        <text x="190" y="48" fill="#fff" font-size="21" font-weight="700" text-anchor="middle">Inspektor Gadget</text>
        <text x="190" y="78" fill="#dfcfde" font-size="17" text-anchor="middle">profile_tcprtt</text>
        <text x="150" y="116" fill="#dfcfde" font-size="16" text-anchor="middle">RTT histogram</text>
        <rect x="228" y="99" width="55" height="29" rx="14" fill="#fff"/>
        <text x="255" y="120" fill="#58204f" font-size="15" font-weight="700" text-anchor="middle">:2224</text>
      </g>

      <path d="M215 200V265" fill="none" stroke="#76536f" stroke-width="4" stroke-dasharray="8 7" marker-end="url(#metricsArrow)"/>
      <text x="235" y="238" fill="#76536f" font-size="16" font-weight="700">kernel RTT</text>
    </g>

    <g transform="translate(595 215)" filter="url(#shadow)">
      <rect width="430" height="500" rx="26" fill="#fff" stroke="#d8cbd6" stroke-width="3"/>
      <text x="215" y="45" fill="#2f052a" font-size="25" font-weight="700" text-anchor="middle">Worker node B</text>

      <g transform="translate(65 85)">
        <rect width="300" height="115" rx="20" fill="#fff8e9" stroke="#f19b24" stroke-width="3"/>
        <ellipse cx="65" cy="42" rx="29" ry="13" fill="#fff" stroke="#f19b24" stroke-width="4"/>
        <path d="M36 42v39c0 7 13 13 29 13s29-6 29-13V42M36 63c0 7 13 13 29 13s29-6 29-13" fill="#fff" stroke="#f19b24" stroke-width="4"/>
        <text x="205" y="48" fill="#7a4d0f" font-size="21" font-weight="700" text-anchor="middle">server pod</text>
        <text x="205" y="78" fill="#8f6e42" font-size="17" text-anchor="middle">responds to client</text>
      </g>

      <g transform="translate(65 265)">
        <rect width="300" height="150" rx="22" fill="url(#igBackground)"/>
        <circle cx="50" cy="60" r="25" fill="#e61d4b"/>
        <path d="M39 60h22M50 49v22" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
        <text x="190" y="48" fill="#fff" font-size="21" font-weight="700" text-anchor="middle">Inspektor Gadget</text>
        <text x="190" y="78" fill="#dfcfde" font-size="17" text-anchor="middle">profile_tcprtt</text>
        <text x="150" y="116" fill="#dfcfde" font-size="16" text-anchor="middle">RTT histogram</text>
        <rect x="228" y="99" width="55" height="29" rx="14" fill="#fff"/>
        <text x="255" y="120" fill="#58204f" font-size="15" font-weight="700" text-anchor="middle">:2224</text>
      </g>

      <path d="M215 200V265" fill="none" stroke="#76536f" stroke-width="4" stroke-dasharray="8 7" marker-end="url(#metricsArrow)"/>
      <text x="235" y="238" fill="#76536f" font-size="16" font-weight="700">kernel RTT</text>
    </g>

    <path d="M460 357C520 320 580 320 645 357" fill="none" stroke="#e61d4b" stroke-width="5" marker-end="url(#trafficArrow)"/>
    <text x="553" y="306" fill="#b3163c" font-size="18" font-weight="700" text-anchor="middle">TCP traffic</text>

    <g transform="translate(1140 205)" filter="url(#shadow)">
      <rect width="400" height="165" rx="24" fill="#fff" stroke="#76536f" stroke-width="3"/>
      <circle cx="68" cy="72" r="34" fill="#f4eef5" stroke="#76536f" stroke-width="5"/>
      <path d="M48 82 62 68l12 8 17-25" fill="none" stroke="#76536f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="255" y="52" fill="#4f344a" font-size="25" font-weight="700" text-anchor="middle">Prometheus</text>
      <text x="255" y="87" fill="#76536f" font-size="18" text-anchor="middle">scrapes every gadget pod</text>
      <text x="255" y="119" fill="#76536f" font-size="18" text-anchor="middle">preserves the node label</text>
    </g>

    <path d="M430 630C780 835 1060 620 1140 325" fill="none" stroke="#76536f" stroke-width="4" stroke-dasharray="9 7" marker-end="url(#metricsArrow)"/>
    <path d="M930 630C1080 645 1120 510 1200 370" fill="none" stroke="#76536f" stroke-width="4" stroke-dasharray="9 7" marker-end="url(#metricsArrow)"/>
    <text x="925" y="754" fill="#76536f" font-size="18" font-weight="700" text-anchor="middle">latency histogram metrics</text>

    <g transform="translate(1140 465)" filter="url(#shadow)">
      <rect width="400" height="250" rx="24" fill="#eef4ff" stroke="#4385f5" stroke-width="3"/>
      <text x="200" y="46" fill="#243b63" font-size="24" font-weight="700" text-anchor="middle">Operational questions</text>
      <line x1="35" y1="68" x2="365" y2="68" stroke="#bdd0f3" stroke-width="2"/>
      <text x="45" y="109" fill="#243b63" font-size="18">• Did p95 RTT increase?</text>
      <text x="45" y="148" fill="#243b63" font-size="18">• Is one node slower?</text>
      <text x="45" y="187" fill="#243b63" font-size="18">• Did latency follow a rollout?</text>
      <text x="45" y="226" fill="#243b63" font-size="18">• Should an alert open?</text>
    </g>

    <path d="M1340 370V465" fill="none" stroke="#4385f5" stroke-width="4" marker-end="url(#metricsArrow)"/>

    <text x="65" y="850" fill="#6f6070" font-size="18">
      Helm installs the DaemonSet, enables the metrics listener, and creates the persistent profile_tcprtt instance.
    </text>
  </g>
</svg>
